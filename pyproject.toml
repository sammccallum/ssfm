[project]
name = "ssfm"
version = "0.1.0"
description = "Strong Stochastic Flow Maps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "diffrax>=0.7.0",
    "equinox>=0.13.6",
    "gdown>=6.0.0",
    "hydra-core>=1.3.2",
    "jax[cuda12]>=0.6.2",
    "matplotlib>=3.10.8",
    "omegaconf>=2.3.0",
    "optax>=0.2.7",
    "pillow>=12.2.0",
    "pot>=0.9.6.post1",
    "wandb>=0.25.1",
]

[project.optional-dependencies]
metrics = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["ssfm/*"]

[tool.ruff.lint]
ignore = ["F821"]

[tool.ruff.lint.isort]
combine-as-imports = true
